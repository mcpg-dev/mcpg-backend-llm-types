[package]
name = "mcpg-backend-llm-types"
version = "0.1.0-beta.13"
license = "Apache-2.0"
edition = "2024"
description = """
Pure data types shared across MCPG's per-provider LLM binding plugins.

The leaf layer under `mcpg-backend-llm-shared`: canonical
request/response shapes (`NormalizedChatRequest`,
`NormalizedChatResponse`, `Message`, `MessageContent`, `ContentPart`,
`ToolCall`, `ToolDef`, `TokenUsage`, `FinishReason`, `Role`, …) and the
error taxonomy (`ConfigError`, `ProviderError`). No async, transport, or
templating dependencies — provider adapters and the chat engine build on
these without pulling the heavier `mcpg-backend-llm-shared` surface.
"""

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
